name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q --cov=core --cov=main --cov-fail-under=95

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t agentledger:ci .
      - name: Run the container and smoke test it
        run: |
          docker run -d --name agentledger -p 8000:8000 agentledger:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
          python3 scripts/smoke_test.py http://127.0.0.1:8000
      - name: Container runs as a non-root user and reports healthy
        run: |
          test "$(docker exec agentledger id -u)" != "0"
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' agentledger)
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "container health status: $status"; exit 1
      - name: Container logs
        if: always()
        run: docker logs agentledger
